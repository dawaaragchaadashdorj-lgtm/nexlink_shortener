# Free Render web service. Links are stored in an external Postgres database
# (DATABASE_URL), so no persistent disk is required.
services:
  - type: web
    name: powerlink-shortener
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run lint && npm test && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Connection string from a free Postgres provider (Neon, Supabase, etc.).
      # sync:false keeps it out of Git; set the real value in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: CREATE_ACCESS_TOKEN
        generateValue: true
